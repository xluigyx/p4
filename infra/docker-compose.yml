services:
  # CLÚSTER RRV (MongoDB/Postgres para velocidad)
  db_rapido:
    image: postgres:16-alpine
    container_name: db_rapido
    environment:
      POSTGRES_DB: rrv_db
      POSTGRES_PASSWORD: bolivia_vota
    ports:
      - "5434:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rrv_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - antigravity_net

  # CLÚSTER OFICIAL (Postgres para consistencia)
  db_oficial:
    image: postgres:16-alpine
    container_name: db_oficial
    environment:
      POSTGRES_DB: oficial_db
      POSTGRES_PASSWORD: bolivia_vota
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficial_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - antigravity_net

  # BACKEND (Orquestador de Bots)
  backend:
    build: ../backend
    environment:
      - DB_OFICIAL=postgresql://postgres:bolivia_vota@db_oficial:5432/oficial_db
      - DB_RAPIDO=postgresql://postgres:bolivia_vota@db_rapido:5432/rrv_db
    volumes:
      - ../backend/ingest:/app/ingest:ro # MAPEO DE LECTURA (Evita Error Invalid cross-device link)
    depends_on:
      db_oficial:
        condition: service_healthy
      db_rapido:
        condition: service_healthy
    networks:
      - antigravity_net

  # FRONTEND (SvelteKit Dashboard)
  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - antigravity_net

networks:
  antigravity_net:
    driver: bridge
