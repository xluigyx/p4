services:
  db-primary:
    image: bitnami/postgresql:16
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=admin
      - POSTGRESQL_DATABASE=elections_db
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/bitnami/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elections_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-replica:
    image: bitnami/postgresql:16
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass
      - POSTGRESQL_MASTER_HOST=db-primary
      - POSTGRESQL_PASSWORD=admin
    depends_on:
      db-primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    volumes:
      - pg_replica_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elections_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend-api:
    build: ../backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db-primary
      - DB_REPLICA_HOST=db-replica
      - DB_USER=postgres
      - DB_PASS=admin
      - DB_NAME=elections_db
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
      - ../data/ingest:/app/ingest

  frontend-svelte:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app

volumes:
  pg_primary_data:
  pg_replica_data:
